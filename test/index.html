<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Love You</title>
    <!-- Tailwind CSS for styling the UI overlay -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at 20% 20%, rgba(124, 58, 237, 0.25), transparent 30%),
                radial-gradient(circle at 80% 30%, rgba(236, 72, 153, 0.22), transparent 28%),
                radial-gradient(circle at 50% 80%, rgba(59, 130, 246, 0.18), transparent 35%),
                #050510;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            display: block;
        }
        /* Custom glowing animation for the text */
        @keyframes pulseGlow {
            0%, 100% {
                text-shadow: 0 0 10px rgba(255, 105, 180, 0.6), 
                             0 0 20px rgba(255, 105, 180, 0.4), 
                             0 0 30px rgba(255, 20, 147, 0.2);
            }
            50% {
                text-shadow: 0 0 20px rgba(255, 105, 180, 0.9), 
                             0 0 35px rgba(255, 105, 180, 0.7), 
                             0 0 50px rgba(255, 20, 147, 0.5);
            }
        }
        .glow-text {
            animation: pulseGlow 3s infinite ease-in-out;
        }
        @keyframes floatUp {
            0%, 100% {
                transform: translateY(0px);
                opacity: 0.7;
            }
            50% {
                transform: translateY(-8px);
                opacity: 1;
            }
        }
        .love-note {
            animation: floatUp 2.5s ease-in-out infinite;
        }
        .music-button {
            pointer-events: auto;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .music-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 105, 180, 0.35);
        }
        .love-sentence {
            line-height: 1.8;
        }
        @keyframes sparkleBurst {
            0% {
                transform: scale(0.5) translateY(10px);
                opacity: 0;
            }
            25% {
                opacity: 1;
            }
            100% {
                transform: scale(1.5) translateY(-30px);
                opacity: 0;
            }
        }
        .sparkle {
            position: absolute;
            font-size: 1.2rem;
            animation: sparkleBurst 2.4s ease-out infinite;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="sparkleLayer" class="absolute inset-0 z-20 pointer-events-none overflow-hidden"></div>

    <!-- Overlay UI for "I Love You" message -->
    <div class="absolute inset-0 pointer-events-none flex flex-col items-center justify-between p-8 z-10">
        <div class="text-center mt-4">
            <div class="mb-3 inline-block rounded-full border border-pink-400/40 bg-pink-950/25 px-5 py-2 backdrop-blur-sm shadow-[0_0_25px_rgba(255,105,180,0.25)]">
                <p class="text-[10px] md:text-xs font-bold tracking-[0.45em] text-pink-200 uppercase glow-text">
                    Capiz State University
                </p>
                <p class="text-[9px] md:text-[11px] mt-1 font-semibold tracking-[0.23em] text-pink-300 uppercase glow-text">
                    Pilar Satellite College
                </p>
            </div>
            <h1 class="text-4xl md:text-6xl font-extrabold text-pink-300 tracking-wider glow-text uppercase">
                I Love You
            </h1>
            <p class="text-pink-300 text-lg md:text-2xl mt-3 font-semibold tracking-[0.25em] uppercase glow-text">
                Trixie Nicole Achas
            </p>
            <p class="love-sentence love-note text-pink-200 text-xs md:text-sm mt-4 font-medium tracking-[0.25em] uppercase glow-text max-w-2xl mx-auto">
                From being my vice mayor to becoming my favorite part of every single day, thank you for making this journey so special. I love you.
            </p>
            <p class="text-pink-400 text-sm md:text-base mt-2 opacity-80 font-light tracking-widest">
                Marco
            </p>
            <div class="mt-6 text-center">
                <p class="text-2xl md:text-4xl font-extrabold text-pink-200 glow-text uppercase tracking-[0.2em] drop-shadow-[0_0_15px_rgba(255,105,180,0.8)]">
                    Will you be mine?
                </p>
            </div>
        </div>
        <div class="text-center mb-4 flex flex-col items-center gap-3">
            <button id="musicToggle" class="music-button pointer-events-auto inline-flex items-center gap-2 rounded-full border border-pink-300/40 bg-pink-950/30 px-4 py-2 text-xs text-pink-200 backdrop-blur-sm tracking-[0.25em] uppercase glow-text">
                ♫ Play Love Song
            </button>
            <span class="text-xs text-pink-500/60 bg-pink-950/30 px-4 py-2 rounded-full border border-pink-800/30 backdrop-blur-sm">
                ✨ Drag to rotate • Scroll to zoom ✨
            </span>
        </div>
    </div>

    <!-- Three.js Library & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- 1. Scene, Camera, Renderer Setup ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050510, 0.025);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- 2. Orbit Controls for Mouse/Touch Interaction ---
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 5;
        controls.maxDistance = 30;

        // --- 3. Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffb6c1, 1.2);
        scene.add(ambientLight);

        const pointLight1 = new THREE.PointLight(0xff1493, 3, 50);
        pointLight1.position.set(5, 5, 5);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0xff69b4, 2, 50);
        pointLight2.position.set(-5, -5, 5);
        scene.add(pointLight2);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
        directionalLight.position.set(10, 20, 15);
        scene.add(directionalLight);

        // --- 4. Create 3D Heart Geometry using Mathematical Formula ---
        function createHeartShape() {
            const x = 0, y = 0;
            const heartShape = new THREE.Shape();
            
            // Standard 2D Heart Path
            heartShape.moveTo(x + 5, y + 5);
            heartShape.bezierCurveTo(x + 5, y + 5, x + 4, y, x, y);
            heartShape.bezierCurveTo(x - 6, y, x - 6, y + 7, x - 6, y + 7);
            heartShape.bezierCurveTo(x - 6, y + 11, x - 3, y + 15.4, x + 5, y + 19);
            heartShape.bezierCurveTo(x + 13, y + 15.4, x + 16, y + 11, x + 16, y + 7);
            heartShape.bezierCurveTo(x + 16, y + 7, x + 16, y, x + 10, y);
            heartShape.bezierCurveTo(x + 7, y, x + 5, y + 5, x + 5, y + 5);

            const extrudeSettings = {
                depth: 4,
                bevelEnabled: true,
                bevelSegments: 5,
                steps: 2,
                bevelSize: 1.5,
                bevelThickness: 1.5
            };

            const geometry = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
            geometry.center(); // Center the geometry origin
            geometry.scale(0.3, 0.3, 0.3); // Scale down to fit nicely in view
            return geometry;
        }

        const heartGeometry = createHeartShape();
        
        // Glossy Pink Material
        const heartMaterial = new THREE.MeshPhysicalMaterial({
            color: 0xff1493,          // Deep pink
            emissive: 0x4a0e2e,        // Subtle inner glow
            roughness: 0.2,            // Smooth / shiny finish
            metalness: 0.1,
            clearcoat: 1.0,            // Extra glossy coat layer
            clearcoatRoughness: 0.1,
            wireframe: false
        });

        const heartMesh = new THREE.Mesh(heartGeometry, heartMaterial);
        scene.add(heartMesh);

        // --- 5. Add Background Floating Particles ---
        const particleCount = 1200;
        const particleGeometry = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount * 3; i += 3) {
            particlePositions[i] = (Math.random() - 0.5) * 60;     // x
            particlePositions[i + 1] = (Math.random() - 0.5) * 60; // y
            particlePositions[i + 2] = (Math.random() - 0.5) * 60; // z

            const colorChoice = Math.random();
            if (colorChoice < 0.5) {
                colors[i] = 1.0; colors[i + 1] = 0.7; colors[i + 2] = 0.9; // pink
            } else if (colorChoice < 0.75) {
                colors[i] = 0.7; colors[i + 1] = 0.9; colors[i + 2] = 1.0; // blue
            } else {
                colors[i] = 0.9; colors[i + 1] = 0.8; colors[i + 2] = 1.0; // purple
            }
        }

        particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        particleGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const particleMaterial = new THREE.PointsMaterial({
            size: 0.12,
            transparent: true,
            opacity: 0.9,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const particles = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particles);

        // Add a soft galaxy glow behind the heart
        const galaxyGlow = new THREE.Mesh(
            new THREE.SphereGeometry(11, 32, 32),
            new THREE.MeshBasicMaterial({
                color: 0x7c3aed,
                transparent: true,
                opacity: 0.08,
                side: THREE.BackSide
            })
        );
        scene.add(galaxyGlow);

        // --- 6. Animation Loop ---
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();
            const distance = camera.position.length();
            const zoomScale = THREE.MathUtils.clamp((distance - 5) / 20, 0.45, 1.6);

            // More visible rotation for the heart
            heartMesh.rotation.y = elapsedTime * 1.2;
            heartMesh.rotation.x = Math.sin(elapsedTime * 1.3) * 0.9;
            heartMesh.rotation.z = Math.sin(elapsedTime * 1.5) * 0.8;

            // scale tied to camera distance: zoom in = bigger heart, zoom out = smaller heart
            const pulse = 1 + Math.sin(elapsedTime * 2.4) * 0.08;
            heartMesh.scale.set(pulse * zoomScale, pulse * zoomScale, pulse * zoomScale);

            // Slowly rotate background particles and glow
            particles.rotation.y = elapsedTime * 0.05;
            particles.rotation.x = Math.sin(elapsedTime * 0.2) * 0.2;
            galaxyGlow.rotation.y = elapsedTime * 0.08;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // --- 7. Local music file with gentle fallback for the love song ---
        const availableTracks = ['Ed_Sheeran_-_Photograph__Lyrics_(48k).m4a', 'love-song.m4a'];
        const loveSong = new Audio();
        let usingFallback = false;
        let fallbackAudioCtx = null;
        let fallbackGain = null;

        function startFallbackMusic() {
            if (usingFallback) return;
            usingFallback = true;

            fallbackAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const now = fallbackAudioCtx.currentTime;
            const notes = [261.63, 329.63, 392.0, 329.63, 293.66, 349.23, 440.0, 392.0];
            fallbackGain = fallbackAudioCtx.createGain();
            fallbackGain.gain.value = 0.04;
            fallbackGain.connect(fallbackAudioCtx.destination);

            notes.forEach((freq, i) => {
                const oscillator = fallbackAudioCtx.createOscillator();
                const gain = fallbackAudioCtx.createGain();
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(freq, now + i * 0.45);
                gain.gain.setValueAtTime(0.0001, now + i * 0.45);
                gain.gain.exponentialRampToValueAtTime(0.12, now + i * 0.45 + 0.08);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.45 + 0.38);
                oscillator.connect(gain);
                gain.connect(fallbackGain);
                oscillator.start(now + i * 0.45);
                oscillator.stop(now + i * 0.45 + 0.42);
            });
        }

        function tryPlayLocalTrack() {
            for (const track of availableTracks) {
                const audio = new Audio(track);
                audio.loop = true;
                audio.volume = 0.7;
                audio.preload = 'auto';
                audio.oncanplaythrough = async () => {
                    try {
                        await audio.play();
                        loveSong.src = track;
                        loveSong.loop = true;
                        loveSong.volume = 0.7;
                        usingFallback = false;
                    } catch (error) {
                        console.log('Audio file exists but play is blocked until user interaction.', error);
                    }
                };
                audio.onerror = () => {
                    console.log(`Track not available: ${track}`);
                };
                audio.load();
                if (audio.readyState >= 2) {
                    return audio;
                }
            }
            return null;
        }

        const musicToggle = document.getElementById('musicToggle');
        musicToggle.addEventListener('click', async () => {
            const song = tryPlayLocalTrack();
            if (song) {
                try {
                    await song.play();
                    musicToggle.textContent = '♫ Photograph On';
                    return;
                } catch (error) {
                    console.log('Audio playback blocked until the user interacts with the page:', error);
                }
            }

            if (!usingFallback) {
                startFallbackMusic();
            }
            if (fallbackAudioCtx && fallbackAudioCtx.state === 'suspended') {
                await fallbackAudioCtx.resume();
            }
            musicToggle.textContent = '♫ Love Song On';
        });

        const sparkleLayer = document.getElementById('sparkleLayer');
        function createSparkles() {
            for (let i = 0; i < 18; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.textContent = i % 2 === 0 ? '💖' : '✨';
                sparkle.style.left = `${Math.random() * 100}%`;
                sparkle.style.top = `${Math.random() * 100}%`;
                sparkle.style.animationDelay = `${(Math.random() * 1.5).toFixed(2)}s`;
                sparkle.style.opacity = Math.random() * 0.8 + 0.2;
                sparkleLayer.appendChild(sparkle);
            }
        }
        createSparkles();

        // --- 8. Responsive Window Resize Handler ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
